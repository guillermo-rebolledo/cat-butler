name: CatButler
options:
  bundleIdPrefix: dev.rebolledo
  deploymentTarget:
    iOS: "26.0"
packages:
  CatButlerCore:
    path: CatButlerCore
targets:
  CatButler:
    type: application
    platform: iOS
    sources: [CatButler]
    dependencies:
      - package: CatButlerCore
    entitlements:
      path: CatButler/CatButler.entitlements
      # iCloud sync to the owner's private CloudKit database. Signing needs a paid Apple Developer team.
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.dev.rebolledo.CatButler]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        # Remote notifications, so iCloud changes from the owner's other devices arrive in the background.
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  CatButlerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CatButlerUITests]
    dependencies:
      - target: CatButler
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CatButler:
    build:
      targets:
        CatButler: all
    test:
      targets: [CatButlerUITests]
